<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চাকরির খবর - প্রবাসী সাহায্য</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <a href="home.html" class="text-slate-400 hover:text-white"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-lg font-bold text-amber-500">চাকরির খবর (Job Listings)</h1>
            <div class="w-4"></div>
        </div>

        <!-- Job Cards -->
        <div class="space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <span class="text-xs font-semibold bg-amber-500/10 text-amber-500 px-2.5 py-1 rounded-md">সৌদি আরব</span>
                <h3 class="font-bold text-lg text-slate-100 mt-2">কনস্ট্রাকশন সাইট সুপারভাইজার</h3>
                <p class="text-xs text-slate-400 mt-1"><i class="fas fa-building mr-1"></i> আল-রিয়াদ কনস্ট্রাকশন গ্রুপ</p>
                <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-700 text-xs text-slate-300">
                    <span><i class="far fa-clock mr-1"></i> ২৫ মে, ২০২৬</span>
                    <button class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg">আবেদন করুন</button>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <span class="text-xs font-semibold bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-md">সংযুক্ত আরব আমিরাত</span>
                <h3 class="font-bold text-lg text-slate-100 mt-2">হোটেল অ্যান্ড রেস্টুরেন্ট স্টাফ</h3>
                <p class="text-xs text-slate-400 mt-1"><i class="fas fa-building mr-1"></i> দুবাই গ্র্যান্ড হোটেল</p>
                <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-700 text-xs text-slate-300">
                    <span><i class="far fa-clock mr-1"></i> ২৭ মে, ২০২৬</span>
                    <button class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg">আবেদন করুন</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
