<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রবাসী সাহায্য - এজেন্টের তালিকা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Navigation -->
        <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h1 class="text-xl font-bold text-amber-500">প্রবাসী সাহায্য</h1>
            <div class="flex gap-2">
                <a href="profile.html" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-amber-500"><i class="fas font-bold fa-user"></i> প্রোফাইল</a>
                <a href="admin.html" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300"><i class="fas fa-cog"></i> এডমিন</a>
            </div>
        </div>

        <h2 class="text-lg font-semibold mb-4 text-slate-300">উপলব্ধ সাহায্যকারী এজেন্ট</h2>
        <div id="agentList" class="grid gap-4 md:grid-cols-2"></div>
    </div>

    <script>
        const defaultAgents = [
            { id: '1', name: 'মোহাম্মদ রহিম', role: 'অফিসিয়াল সাহায্যকারী এজেন্ট', location: 'বাগদাদ, ইরাক', phone: '+8801700000000', wa: '8801700000000' },
            { id: '2', name: 'সেলিনা আক্তার', role: 'কমিউনিটি সহায়তা এজেন্ট', location: 'দুবাই, সংযুক্ত আরব আমিরাত', phone: '+8801800000000', wa: '8801800000000' }
        ];

        function loadAgents() {
            const stored = JSON.parse(localStorage.getItem('agents')) || defaultAgents;
            const container = document.getElementById('agentList');
            container.innerHTML = stored.map(a => `
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-lg text-amber-400">${a.name}</h3>
                        <p class="text-xs text-slate-400">${a.role}</p>
                        <p class="text-sm text-slate-300 mt-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> ${a.location}</p>
                    </div>
                    <div class="flex gap-2 mt-4">
                        <a href="tel:${a.phone}" class="flex-1 text-center bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-amber-400"><i class="fas fa-phone"></i></a>
                        <a href="https://wa.me/${a.wa}" target="_blank" class="flex-1 text-center bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-emerald-400"><i class="fab fa-whatsapp"></i></a>
                        <a href="agent-detail.html?id=${a.id}" class="flex-[2] text-center bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded-lg">প্রোফাইল দেখুন</a>
                    </div>
                </div>
            `).join('');
        }
        loadAgents();
    </script>
</body>
</html>
